# 1) В блок http{} — например, файлом /etc/nginx/conf.d/ebook-tutor-zone.conf:
#    Лимит на IP щадящий: студенты из аудиторий выходят в интернет через один NAT-адрес университета.
#    Основные лимиты — на пользователя, в самом сервисе (RATE_PER_MIN / RATE_PER_DAY).
limit_req_zone $binary_remote_addr zone=ebook_tutor:10m rate=120r/m;

# 2) Внутрь server { … listen 443 ssl; server_name ebook.vku.edu.kz … } в /etc/nginx/sites-available/ebook,
#    рядом с location / { … }. Заголовки безопасности из snippets/ebook-headers.conf наследуются
#    (в этом location нет своих add_header).
location /api/ {
    limit_req zone=ebook_tutor burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";

    # поток ответа модели (text/event-stream) — без буферизации, первый ответ на CPU может идти до минуты
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
}
