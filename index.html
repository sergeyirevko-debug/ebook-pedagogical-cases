<style>
:root{
  --blue:#1f56c3; --blue-d:#0d2f6e; --blue-dd:#0a2353; --blue-l:#e9f0fd; --blue-ll:#f4f7fd;
  --violet:#6b4de6; --teal:#14a39a;
  --ink:#16223a; --ink2:#4a5874; --ink3:#7d8aa3; --line:#e1e7f2;
  --bg:#f3f6fb; --card:#ffffff;
  --good:#16a36a; --good-bg:#e5f7ee; --risky:#d9822b; --risky-bg:#fdf1e3; --weak:#c94545; --weak-bg:#fbe8e8;
  --r:16px; --shadow:0 2px 6px rgba(16,40,90,.05),0 8px 24px rgba(16,40,90,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
textarea,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;color:var(--blue-dd)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar1{display:flex;align-items:center;gap:22px;height:64px}
.bar2{border-top:1px solid var(--line)}
.bar2 .nav{height:46px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;background:var(--blue-d);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:-.5px;flex:none}
.brand small{display:block;font-size:11.5px;line-height:1.3;color:var(--blue-d);font-weight:700;text-transform:uppercase;max-width:300px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav a{padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.nav a:hover{background:var(--blue-ll);color:var(--blue)}
.nav a.on{color:var(--blue);background:var(--blue-l)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.lang{display:flex;background:var(--blue-ll);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink3)}
.lang button.on{background:var(--blue);color:#fff}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--blue-ll);color:var(--blue)}
.proto{font-size:11px;font-weight:600;color:var(--risky);background:var(--risky-bg);padding:4px 8px;border-radius:6px;white-space:nowrap}

main{padding:28px 0 60px;min-height:70vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.sec-title{font-size:20px;font-weight:700;margin:34px 0 14px;color:var(--blue-dd)}
.muted{color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14.5px;transition:.15s}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:#1846a6}
.btn-v{background:var(--violet);color:#fff}.btn-v:hover{background:#5a3dd1}
.btn-l{background:var(--blue-l);color:var(--blue)}.btn-l:hover{background:#dbe6fb}
.btn-o{border:1px solid var(--line);background:#fff;color:var(--ink2)}.btn-o:hover{border-color:var(--blue);color:var(--blue)}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--blue-l);color:var(--blue)}
.lvl-low{background:var(--good-bg);color:var(--good)}.lvl-med{background:var(--risky-bg);color:var(--risky)}.lvl-high{background:var(--weak-bg);color:var(--weak)}
.oc-good{background:var(--good-bg);color:var(--good)}.oc-risky{background:var(--risky-bg);color:var(--risky)}.oc-weak{background:var(--weak-bg);color:var(--weak)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;overflow:hidden;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-l{padding:44px 40px}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-.5px}
.hero h1 span{display:block;color:var(--blue)}
.hero p.lead{font-size:18px;color:var(--ink2);margin:14px 0 24px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;max-width:440px}
.search input{border:0;outline:0;padding:13px 0;flex:1;background:transparent;min-width:0}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.hero-r{position:relative;min-height:340px;background:linear-gradient(160deg,#cfe0fb 0%,#9cc0f2 45%,#3f78d6 100%)}
.hero-r svg{position:absolute;inset:0;width:100%;height:100%}
.slogan{position:absolute;right:26px;top:26px;max-width:210px;color:#fff;font-weight:700;font-size:20px;line-height:1.25;text-transform:uppercase;text-shadow:0 2px 12px rgba(10,35,83,.35)}
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:22px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:14px;background:var(--blue-ll);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:center;color:var(--ink2);transition:.15s}
.cat:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}
.cat .ci{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--teal)}
.cat .ci .ico{width:24px;height:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:22px;border-top:1px solid var(--line)}
.stat{padding:18px 18px 4px 0}
.stat b{display:block;font-size:26px;color:var(--blue-dd);font-weight:800}
.stat span{font-size:13px;color:var(--ink3)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* case card */
.ccard{display:flex;gap:14px;padding:14px;align-items:center;transition:.15s}
.ccard:hover{border-color:#bcd0f5;transform:translateY(-2px)}
.thumb{width:86px;height:66px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.thumb .ico{width:30px;height:30px;stroke-width:1.6}
.ccard .code{font-size:12px;font-weight:700;color:var(--ink3)}
.ccard h4{font-size:15.5px;margin:2px 0 6px}
.ccard .row{display:flex;gap:6px;flex-wrap:wrap}

/* steps */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.step{padding:16px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;margin-bottom:10px}
.step h4{font-size:14.5px;margin-bottom:4px}
.step p{font-size:12.5px;color:var(--ink3);margin:0}

/* catalog */
.catalog{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.side{padding:10px;position:sticky;top:130px}
.side h4{font-size:14px;padding:8px 10px 10px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13.5px;color:var(--ink2)}
.side a .ico{width:18px;height:18px;color:var(--teal)}
.side a em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink3)}
.side a:hover{background:var(--blue-ll)}
.side a.on{background:var(--blue-l);color:var(--blue);font-weight:600}
.list{display:flex;flex-direction:column;gap:12px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filters .search{flex:1;max-width:none}
.filters select{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}

/* case page */
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink3);margin-bottom:14px}
.crumb a:hover{color:var(--blue)}
.case-head{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:24px}
.case-head .code{font-weight:700;color:var(--ink3)}
.case-head h1{font-size:28px;margin:4px 0 12px}
.case-img{border-radius:14px;min-height:170px;display:grid;place-items:center;color:#fff}
.case-img .ico{width:60px;height:60px;stroke-width:1.3;opacity:.9}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 24px;overflow-x:auto}
.tabs a{padding:12px 14px;font-weight:600;font-size:14px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--blue);border-color:var(--blue)}
.tabs a .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle}
.case-body{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:24px}
.case-body h3{font-size:18px;margin-bottom:10px}
.case-text{font-size:16px;line-height:1.65;color:var(--ink)}
.actions{display:flex;flex-direction:column;gap:10px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink2)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:76px;resize:vertical;background:#fff;outline:0}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.savehint{font-size:12.5px;color:var(--good);height:18px}
.opt{display:block;width:100%;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;transition:.15s}
.opt:hover{border-color:#a9c2f2}
.opt.sel{border-color:var(--blue);background:var(--blue-ll)}
.opt .lt{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--blue-l);color:var(--blue);font-weight:700;font-size:13px;margin-right:10px}
.opt.sel .lt{background:var(--blue);color:#fff}
.cons{margin-top:12px;padding:12px 14px;border-radius:10px;background:#fff;border:1px dashed var(--line);font-size:14px;color:var(--ink2)}
.cons b{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--ink)}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:#fff;color:var(--ink2)}
.pchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.gate{text-align:center;padding:40px 20px}
.gate .ico{width:44px;height:44px;color:var(--blue);margin-bottom:10px}
.expert{border-left:4px solid var(--teal);background:#effaf8;padding:16px 18px;border-radius:0 12px 12px 0;font-size:15.5px;line-height:1.65}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.compare .box{padding:14px;border-radius:12px;background:var(--blue-ll);font-size:14px}
.compare .box h4{font-size:13px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}

/* chat */
.chat-wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.chat{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:520px;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bot{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#3b74e0,#0d2f6e);display:grid;place-items:center;color:#fff;flex:none}
.bot .ico{width:24px;height:24px}
.chat-h b{display:block;color:var(--blue-dd)}
.chat-h small{color:var(--ink3)}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--blue-ll)}
.msg{display:flex;gap:10px;max-width:86%}
.msg .bot{width:32px;height:32px}.msg .bot .ico{width:18px;height:18px}
.bubble{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14.5px}
.bubble ol{margin:6px 0 0;padding-left:20px}
.bubble .meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;color:var(--ink3)}
.bubble .meta button{color:var(--ink3);font-size:11.5px;text-decoration:underline}
.bubble .meta button:hover{color:var(--weak)}
.msg.me{align-self:flex-end}
.msg.me .bubble{background:var(--blue);color:#fff;border-color:var(--blue)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{padding:7px 12px;border-radius:999px;background:var(--blue-l);color:var(--blue);font-size:13px;font-weight:600}
.quick button:hover{background:#d7e3fa}
.compose{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);background:#fff}
.compose input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;outline:0;min-width:0}
.compose input:focus{border-color:var(--blue)}
.send{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.typing{display:flex;gap:4px;padding:6px 2px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
.feat{list-style:none;padding:0;margin:14px 0}
.feat li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--blue-ll);margin-bottom:8px;font-size:13.5px}
.feat li .ico{color:var(--blue)}
.ai-promo{background:linear-gradient(160deg,#0d2f6e,#1f56c3);color:#fff;padding:22px;border-radius:var(--r)}
.ai-promo h3{color:#fff;font-size:20px;margin:12px 0 4px}
.ai-promo .feat li{background:rgba(255,255,255,.95);color:var(--ink)}

/* video */
.player{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;color:#fff}
.play{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--blue);display:grid;place-items:center;box-shadow:0 6px 30px rgba(0,0,0,.25)}
.play .ico{width:30px;height:30px;fill:currentColor}
.pbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.55));font-size:12.5px}
.pbar .track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.soon{position:absolute;top:12px;left:12px;font-size:12px;font-weight:600;background:rgba(10,35,83,.6);padding:5px 10px;border-radius:8px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.vitem{overflow:hidden}
.vitem .player{border-radius:0;aspect-ratio:16/10}
.vitem .play{width:46px;height:46px}.vitem .play .ico{width:20px;height:20px}
.vitem .t{padding:12px 14px}
.qlist{margin:0;padding-left:20px}.qlist li{margin-bottom:8px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:600}
.checkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.checkrow input{width:18px;height:18px;accent-color:var(--blue)}
.formrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.formrow select,.formrow input{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--blue-dd);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:var(--shadow);animation:fi .2s}
@keyframes fi{from{opacity:0;transform:translate(-50%,8px)}}

.about-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.about-cards .card h3{display:flex;gap:12px;align-items:center;font-size:19px;margin-bottom:10px}
.about-cards .card h3 .ico{width:30px;height:30px;color:var(--blue)}
.ticks{list-style:none;padding:0;margin:0}
.ticks li{display:flex;gap:10px;margin-bottom:9px;font-size:14px}
.ticks li .ico{color:var(--teal);flex:none;margin-top:1px}
.access{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.access .card{text-align:center;padding:20px 12px;font-size:13.5px;color:var(--ink2)}
.access .ai{width:54px;height:54px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;margin:0 auto 10px}
.access .ai .ico{width:26px;height:26px}
.band{margin-top:30px;background:var(--blue-dd);color:#dfe8fb;border-radius:var(--r);display:grid;grid-template-columns:repeat(4,1fr)}
.band div{display:flex;gap:12px;align-items:center;padding:20px;font-size:13.5px;border-right:1px solid rgba(255,255,255,.12)}
.band div:last-child{border:0}
.band .ico{width:30px;height:30px;color:#fff}

footer{border-top:1px solid var(--line);background:#fff;padding:18px 0;font-size:12.5px;color:var(--ink3)}
.tabbar{display:none}

@media (max-width:1080px){
  .nav a{padding:8px 7px;font-size:12.5px}
  .steps{grid-template-columns:repeat(3,1fr)}
  .access{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  .bar2,.proto{display:none}
  .brand small{font-size:10px;max-width:180px}
  .case-img{min-height:90px}
  .case-img .ico{width:40px;height:40px}
  .bubble .meta{flex-direction:column;gap:2px}
  #newchat{white-space:nowrap}
  .hero{grid-template-columns:1fr}
  .hero-r{min-height:200px}
  .hero-l{padding:28px 22px}
  .hero h1{font-size:28px}
  .cats{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:1fr 1fr}
  .grid3,.grid2,.about-cards{grid-template-columns:1fr}
  .catalog,.chat-wrap,.case-head,.case-body{grid-template-columns:1fr}
  .side{position:static}
  .chat-side{display:none}
  .chat{height:calc(100vh - 210px)}
  .band{grid-template-columns:1fr 1fr}
  .compare{grid-template-columns:1fr}
  main{padding-bottom:90px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:4px 0}
  .tabbar a.on{color:var(--blue)}
  footer{display:none}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .steps,.access{grid-template-columns:1fr 1fr}
  .case-head,.case-body{padding:18px}
  .tabs{margin:0 18px}
  .ccard .thumb{width:64px;height:56px}
  .band{grid-template-columns:1fr}
}

.quicklinks{display:none;gap:10px;flex-direction:column;margin-bottom:16px}
.quicklinks a{display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600;color:var(--ink2)}
.quicklinks a .ico:first-child{color:var(--blue)}
.quicklinks a span{flex:1}
@media (max-width:860px){.quicklinks{display:flex}}
@media (max-width:560px){.brand small{display:none}}

/* ---------- авторизация ---------- */
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:#fff}
.userchip:hover{border-color:var(--blue)}
.uc-txt b{display:block;font-size:13px;line-height:1.2;color:var(--ink)}
.uc-txt small{display:block;font-size:11.5px;color:var(--ink3)}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#3b74e0,#0d2f6e);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.avatar.sm{width:32px;height:32px;font-size:12.5px}
.nav a.rolelink{color:var(--violet)}
.nav a.rolelink.on{background:#efeafd;color:var(--violet)}
.tab-lock{width:14px;height:14px;margin-left:5px;vertical-align:-2px;opacity:.6}
.pseud{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink3);margin-top:2px}
.pseud .ico{width:12px;height:12px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:var(--blue-ll);padding:1px 5px;border-radius:5px}
.note-line{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:13.5px;margin:0 0 14px}
.note-line .ico{width:16px;height:16px;color:var(--teal)}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.tscroll{overflow-x:auto}
.tscroll table{min-width:520px}
td select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.rev-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rev-item:last-child{border:0}
.rev-act{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}

.auth-wrap{display:grid;place-items:center;padding:10px 0 30px}
.auth-card{width:100%;max-width:480px;padding:30px 28px}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.auth-logo small{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--blue-d);line-height:1.3}
.auth-h{font-size:24px;margin-bottom:6px}
.auth-card>.muted{margin:0 0 18px}
.auth-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;transition:.15s}
.auth-opt:hover{border-color:var(--blue)}
.auth-opt>.ico:first-child{width:24px;height:24px;color:var(--blue)}
.auth-opt span{flex:1}
.auth-opt b{display:block;font-size:15px}
.auth-opt small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.auth-opt.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.auth-opt.primary>.ico,.auth-opt.primary small{color:#dbe6fb}
.auth-opt.primary:hover{background:#1846a6}
.auth-info{display:flex;gap:10px;align-items:flex-start;background:#effaf8;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2);margin:14px 0}
.auth-info .ico{color:var(--teal);width:18px;height:18px;margin-top:1px}
.auth-guest{display:block;text-align:center;color:var(--blue);font-weight:600;font-size:14px;padding:6px}
.auth-back{color:var(--ink3);font-size:13.5px;margin-bottom:12px}
.auth-back:hover{color:var(--blue)}
.auth-badge{width:52px;height:52px;border-radius:14px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;margin-bottom:12px}
.auth-badge .ico{width:26px;height:26px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;position:relative;transition:.15s}
.role-card:hover{border-color:var(--blue);background:var(--blue-ll)}
.role-card>.ico{width:24px;height:24px;color:var(--blue);margin-bottom:4px}
.role-card b{font-size:14.5px}
.role-card small{font-size:12.5px;color:var(--ink2)}
.role-card em{font-style:normal;font-size:12px;color:var(--ink3)}
.role-card .chip{position:absolute;top:10px;right:10px;font-size:10.5px}
.code-in{width:100%;font-size:28px;letter-spacing:12px;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:12px;outline:0}
.code-in:focus,.text-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.text-in{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;outline:0}
.hint{font-size:12.5px;color:var(--ink3);margin:8px 0 14px}
.consent{margin:6px 0 16px}
.consent li{font-size:14px}
.auth-row{display:flex;gap:10px;justify-content:flex-end}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.sess{margin-bottom:16px}
.sess-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.sess-top .chip{margin-top:4px}
.sess-list{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
.sess-list li{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink2)}
.sess-list .ico{width:17px;height:17px;color:var(--teal)}
.sess-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.role-sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);margin-right:auto}
.role-sw select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
@media (max-width:860px){
  .uc-txt{display:none}
  .userchip{padding:3px}
  #hdr-login{padding:7px 10px}
}
@media (max-width:480px){
  .role-grid{grid-template-columns:1fr}
  .auth-card{padding:22px 18px}
}

.logo-img{height:46px;width:auto;flex:none;display:block}
.auth-logo .logo-img{height:52px}

}

/* ---------- вход / выход ---------- */
function startLogin(next) { LOGIN = { step: 'start', next: next || LOGIN.next || '' }; }
function finishLogin(role, src) {
  USER = { ...DEMO_USERS[role], role, src: src || DEMO_USERS[role].src, mfa: ROLES[role].mfa, at: new Date().toISOString() };
  store.set('user', USER);
  CHAT = uget('chat', null);
  audit('a_login', t(ROLES[role]));
  if (!store.get('consent.' + USER.id, null)) { LOGIN.step = 'consent'; render(); return; }
  goAfterLogin();
}
function goAfterLogin() {
  const next = LOGIN.next; LOGIN = { step: 'start' };
  toast(`${u('welcome')} ${USER.name}`);
  location.hash = next || '#/' + ROLES[USER.role].home;
  render();
}
function logout(silent) {
  if (USER) audit('a_logout');
  USER = null; store.set('user', null); CHAT = null; LOGIN = { step: 'start' };
  if (!silent) location.hash = '#/home';
  render();
}

/* ---------- обработчики ---------- */
function bindAuth(route) {
  document.querySelectorAll('[data-next]').forEach(a => a.onclick = () => startLogin(a.dataset.next));
  const lo = $('#hdr-login'); if (lo) lo.onclick = () => startLogin(location.hash.includes('login') ? '' : location.hash);

  if (route === 'profile' && USER) {
    $('#logout').onclick = () => logout();
    $('#withdraw').onclick = () => { audit('a_withdraw'); store.set('consent.' + USER.id, null); toast(u('withdrawn')); logout(); };
    $('#roleswitch').onchange = e => { const r = e.target.value; audit('a_role', t(ROLES[r])); finishLogin(r); };
  }
  if (route === 'editor') document.querySelectorAll('[data-cms]').forEach(b => b.onclick = () => toast(u('cms_demo')));
  if (route === 'review') {
    document.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => toast(b.dataset.rev === 'ok' ? u('approved') : u('returned')));
    document.querySelectorAll('[data-resolve]').forEach(b => b.onclick = () => { const r = store.get('reports', []); r.splice(+b.dataset.resolve, 1); store.set('reports', r); render(); });
  }
  if (route === 'admin') document.querySelectorAll('[data-setrole]').forEach(s => s.onchange = () => { audit('a_role_set', `${s.dataset.setrole} → ${t(ROLES[s.value])}`); toast(u('role_changed')); render(); });

  if (route !== 'login') return;
  document.querySelectorAll('[data-auth]').forEach(b => b.onclick = (e) => {
    const k = b.dataset.auth;
    if (k === 'guest') { LOGIN = { step: 'start' }; return; }
    e.preventDefault();
    if (k === 'sso' || k === 'lms') { LOGIN.src = k; LOGIN.step = 'pick'; }
    if (k === 'invite') LOGIN.step = 'invite';
    if (k === 'back') LOGIN.step = LOGIN.step === 'mfa' ? 'pick' : LOGIN.step === 'code' ? 'invite' : 'start';
    if (k === 'decline') { logout(true); LOGIN.step = 'start'; location.hash = '#/home'; return; }
    render();
  });
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
    LOGIN.role = b.dataset.role;
    if (ROLES[LOGIN.role].mfa) { LOGIN.step = 'mfa'; render(); $('#mfa')?.focus(); }
    else finishLogin(LOGIN.role, LOGIN.src);
  });
  const mf = $('#mfaf'); if (mf) mf.onsubmit = e => { e.preventDefault(); if (!/^\d{6}$/.test($('#mfa').value)) { toast(u('mfa_bad')); return; } finishLogin(LOGIN.role, LOGIN.src); };
  const inf = $('#invf'); if (inf) inf.onsubmit = e => { e.preventDefault(); const v = $('#email').value.trim(); if (!/^\S+@\S+\.\S+$/.test(v)) { toast(u('email_bad')); return; } LOGIN.email = v; LOGIN.step = 'code'; render(); $('#otp')?.focus(); };
  const cf = $('#codef'); if (cf) cf.onsubmit = e => { e.preventDefault(); if (!/^\d{6}$/.test($('#otp').value)) { toast(u('mfa_bad')); return; } finishLogin('mentor', 'invite'); };
  const cb = $('#cons'), ac = $('#accept');
  if (cb && ac) { cb.onchange = () => ac.disabled = !cb.checked; ac.onclick = () => { store.set('consent.' + USER.id, { v: CONSENT_VERSION, at: new Date().toISOString() }); audit('a_consent', CONSENT_VERSION); goAfterLogin(); }; }
}

/* ---------- AI-тьютор (демо) ----------
   В продакшене askTutor() отправляет запрос на сервер:
   POST /api/tutor {caseId, history, lang} → LLM + RAG по методбазе
   с системной инструкцией «сократический тьютор» и экспертной картой кейса. */
let CHAT = uget('chat', null);
function chatInit(caseId) {
  CHAT = { caseId: caseId || null, step: 0, msgs: [] };
  CHAT.msgs.push({ from: 'ai', kind: 'hello' });
  if (caseId) CHAT.msgs.push({ from: 'ai', kind: 'intro', step: 0 });
  else CHAT.msgs.push({ from: 'ai', kind: 'pick' });
  uset('chat', CHAT);
}
function redactPII(s) {
  let hit = false;
  const r = s.replace(/\b\d{12}\b/g, () => (hit = true, '[ИИН скрыт]'))
    .replace(/(\+?7|8)[\s(-]*\d{3}[\s)-]*\d{3}[\s-]*\d{2}[\s-]*\d{2}/g, () => (hit = true, '[тел. скрыт]'))
    .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, () => (hit = true, '[e-mail скрыт]'));
  return { text: r, hit };
}
function askTutor(text) {
  const out = [];
  const low = text.toLowerCase();
  const { text: clean, hit } = redactPII(text);
  CHAT.msgs.push({ from: 'me', text: clean });
  if (hit) out.push({ from: 'ai', kind: 'pii' });
  const wantsAnswer = /(правильн|верн|ответ|дұрыс|жауап)/.test(low);
  if (!CHAT.caseId) {
    const words = low.split(/[^\p{L}\d]+/u).filter(w => w.length > 3);
    const found = CASES.filter(c => words.some(w => [c.title.ru, c.title.kz, c.text.ru, c.text.kz].join(' ').toLowerCase().includes(w.slice(0, 5))));
    out.push({ from: 'ai', kind: 'suggest', ids: (found.length ? found : CASES).slice(0, 3).map(c => c.id) });
  } else {
    const c = caseById(CHAT.caseId);
    CHAT.step++;
    if (wantsAnswer) out.push({ from: 'ai', kind: 'noanswer', step: Math.min(CHAT.step, c.ai.length - 1) });
    else if (CHAT.step < c.ai.length) out.push({ from: 'ai', kind: 'ask', step: CHAT.step, ack: CHAT.step % 4 });
    else out.push({ from: 'ai', kind: 'finish' });
  }
  return out;
}
function aiMsgHTML(m, i) {
  const c = CHAT.caseId ? caseById(CHAT.caseId) : null;
  let h = '';
  if (m.kind === 'hello') h = u('ai_hello');
  if (m.kind === 'pick') h = `${u('ai_pick')}<div class="quick">${CASES.map(x => `<button data-pick="${x.id}">${x.id} · ${esc(t(x.title))}</button>`).join('')}</div>`;
  if (m.kind === 'suggest') h = `${u('ai_suggest')}<div class="quick">${m.ids.map(id => `<button data-pick="${id}">${id} · ${esc(t(caseById(id).title))}</button>`).join('')}</div>`;
  if (m.kind === 'pii') h = `⚠️ ${u('ai_pii')}`;
  if (c && m.kind === 'intro') h = `${u('ai_case_intro').replace('{t}', esc(t(c.title)))}<ol>${c.ai.slice(0, 1).map(q => `<li>${t(q)}</li>`).join('')}</ol>`;
  if (c && m.kind === 'ask') h = `${UI[LANG].ai_ack[m.ack]} ${t(c.ai[m.step])}`;
  if (c && m.kind === 'noanswer') h = `${u('ai_no_answer')} ${t(c.ai[m.step])}`;
  if (c && m.kind === 'finish') h = `${u('ai_finish')}<div class="quick"><button data-go="#/case/${c.id}/solutions">${u('ai_to_solutions')}</button><button data-go="#/case/${c.id}/comment">${u('ai_to_expert')}</button></div>`;
  const meta = (m.kind === 'hello' || m.kind === 'pick') ? '' : `<div class="meta"><span>${u('ai_label')}</span><button data-report="${i}">${m.reported ? '✓' : u('ai_report')}</button></div>`;
  return `<div class="msg"><div class="bot">${ic('bot')}</div><div class="bubble">${h}${meta}</div></div>`;
}
function pageAI(caseId) {
  if (!CHAT || (caseId && CHAT.caseId !== caseId)) chatInit(caseId);
  const c = CHAT.caseId ? caseById(CHAT.caseId) : null;
  return `<div class="chat-wrap">
    <aside class="chat-side">
      <div class="ai-promo"><div class="bot" style="width:56px;height:56px">${ic('bot')}</div><h3>${u('ai_name')}</h3>
        <ul class="feat">${UI[LANG].ai_features.map(f => `<li>${ic('check')}${f}</li>`).join('')}</ul></div>
      ${c ? `<div style="margin-top:14px">${caseCard(c)}</div>` : ''}
    </aside>
    <section class="card chat">
      <div class="chat-h"><div class="bot">${ic('bot')}</div><div><b>${u('ai_name')}</b><small>${u('ai_org')}${c ? ' · ' + c.id : ''}</small><small class="pseud">${ic('lock')} ${u('pseud')}: <code>${pseudOf(USER.id)}</code></small></div>
        <button class="btn btn-o" id="newchat" style="margin-left:auto;padding:8px 12px;font-size:13px">${u('ai_reset')}</button></div>
      <div class="msgs" id="msgs">${CHAT.msgs.map((m, i) => m.from === 'me' ? `<div class="msg me"><div class="bubble">${esc(m.text)}</div></div>` : aiMsgHTML(m, i)).join('')}</div>
      <form class="compose" id="compose"><input id="cinput" autocomplete="off" placeholder="${u('ai_ph')}"><button class="send" aria-label="send">${ic('send')}</button></form>
    </section></div>`;
}

function videoPlayer(c, big) {
  return `<div class="player" style="${grad(c.hue)}"><span class="soon">${u('video_soon')}</span>
    <div class="play">${ic('play')}</div>
    ${big ? `<div class="pbar"><span>0:00 / 2:35</span><div class="track"></div>${ic('monitor')}</div>` : ''}</div>`;
}
function pageVideo(id) {
  const c = id && caseById(id);
  if (!c) return `<h2 class="sec-title" style="margin-top:0">${u('video_title')}</h2>
    <div class="vlist">${CASES.map(x => `<a class="card vitem" href="#/video/${x.id}">${videoPlayer(x)}<div class="t"><div class="muted" style="font-size:12px;font-weight:700">${x.id}</div><b>${esc(t(x.title))}</b></div></a>`).join('')}</div>`;
  return `<div class="crumb"><a href="#/video">${u('video_title')}</a>${ic('chev')}<span>${c.id}</span></div>
    <div class="grid2" style="grid-template-columns:1.6fr 1fr">
      <div class="card pad">${videoPlayer(c, true)}<h2 style="margin-top:16px">${c.id} · ${esc(t(c.title))}</h2><p class="muted">${esc(t(c.short))}</p></div>
      <div class="card pad"><h3 style="margin-bottom:12px">${u('video_q')}</h3><ol class="qlist">${VIDEO_QUESTIONS.map(q => `<li>${t(q)}</li>`).join('')}</ol>
        <div class="actions" style="margin-top:18px"><a class="btn btn-p" href="#/case/${c.id}/analysis">${u('video_to_case')}</a><a class="btn btn-v" href="#/ai/${c.id}">${ic('bot')} ${u('discuss')}</a></div></div>
    </div>`;
}

function pageMaterials() {
  return `<h2 class="sec-title" style="margin-top:0">${u('mat_title')}</h2>
    <div class="grid2">
      <div class="card pad"><h3 style="margin-bottom:14px">${u('mat_algo')}</h3>
        ${ALGORITHM.map((s, i) => `<div style="display:flex;gap:12px;margin-bottom:12px"><div class="step" style="padding:0"><div class="n">${i + 1}</div></div><div><b>${t(s)}</b><div class="muted" style="font-size:14px">${t(s.d)}</div></div></div>`).join('')}</div>
      <div class="card pad"><h3 style="margin-bottom:14px">${u('mat_princ')}</h3>
        <ul class="ticks">${PRINCIPLES.map(p => `<li>${ic('tick')}${t(p)}</li>`).join('')}</ul>
        <p class="muted" style="font-size:13px;margin-top:16px">${u('mat_note')}</p></div>
    </div>`;
}

function pageProfile() {
  const pf = portfolio();
  const bm = bookmarks().map(caseById).filter(Boolean);
  return `<h2 class="sec-title" style="margin-top:0">${u('prof_title')}</h2>${sessionCard()}
    <div class="grid3" style="margin-bottom:16px">
      <div class="card pad"><div class="muted">${u('progress')}</div><b style="font-size:30px;color:var(--blue-dd)">${pf.length} / ${CASES.length}</b>
        <div style="height:8px;background:var(--blue-l);border-radius:4px;margin-top:8px"><div style="height:8px;border-radius:4px;background:var(--blue);width:${pf.length / CASES.length * 100}%"></div></div></div>
      <div class="card pad"><div class="muted">${u('bookmarks')}</div><b style="font-size:30px;color:var(--blue-dd)">${bm.length}</b></div>
      <div class="card pad" style="display:flex;align-items:center"><button class="btn btn-l btn-block" id="csv">${ic('download')} ${u('export_csv')}</button></div>
    </div>
    <div class="quicklinks">${[...(({ teacher: [['teacher', 'teacher', 'nav_teacher']], methodist: [['editor', 'doc', 'nav_editor']], expert: [['review', 'award', 'nav_review']], admin: [['admin', 'lock', 'nav_admin']] })[USER.role] || []), ['materials', 'book', 'nav_materials'], ['about', 'list', 'nav_about']].map(([r, i, k]) => `<a class="card" href="#/${r}">${ic(i)}<span>${u(k)}</span>${ic('chev', 'muted')}</a>`).join('')}</div>
    <div class="grid2">
      <div class="card pad"><h3 style="margin-bottom:12px">${u('portfolio')}</h3>
        ${pf.length ? `<table><tr><th>${u('nav_catalog')}</th><th>${u('teach_choice')}</th></tr>${pf.map(({ c, d }) => `<tr><td><a href="#/case/${c.id}/comment" style="color:var(--blue);font-weight:600">${c.id}</a> ${esc(t(c.title))}</td><td>${d.choice === 'own' ? u('own') : 'ABC'[d.choice] + ' · <span class="chip ' + OUTCOME[c.options[d.choice].oc].cls + '">' + t(OUTCOME[c.options[d.choice].oc]) + '</span>'}</td></tr>`).join('')}</table>` : `<p class="muted">${u('empty_portfolio')}</p>`}</div>
      <div class="card pad"><h3 style="margin-bottom:12px">${u('bookmarks')}</h3>
        ${bm.length ? `<div class="list">${bm.map(caseCard).join('')}</div>` : `<p class="muted">${u('empty_bm')}</p>`}</div>
    </div>`;
}

function pageTeacher() {
  const demo = [['Студент 01', 'done', 1, 92], ['Студент 02', 'done', 0, 74], ['Студент 03', 'prog', null, null], ['Студент 04', 'done', 'own', 88], ['Студент 05', 'none', null, null]];
  const st = { done: ['st_done', 'oc-good'], prog: ['st_prog', 'oc-risky'], none: ['st_none', ''] };
  const c = CASES[0];
  return `<h2 class="sec-title" style="margin-top:0">${u('teach_title')}</h2>
    <div class="grid2">
      <div class="card pad"><h3 style="margin-bottom:12px">${u('teach_assign')}</h3>
        ${CASES.map(x => `<label class="checkrow"><input type="checkbox" ${x.id === c.id ? 'checked' : ''}><b>${x.id}</b> ${esc(t(x.title))}<span class="chip ${LEVELS[x.level].cls}" style="margin-left:auto">${t(LEVELS[x.level])}</span></label>`).join('')}
        <div class="formrow"><select aria-label="${u('teach_group')}">${(USER.groups || []).map(g => `<option>${u('teach_group')}: ${g}</option>`).join('')}</select><input type="date" aria-label="${u('teach_deadline')}"></div>
        <button class="btn btn-p" id="assign">${u('teach_btn')}</button></div>
      <div class="card pad"><h3 style="margin-bottom:4px">${u('teach_results')} · ${c.id}</h3><p class="note-line" style="margin:0 0 10px">${ic('lock')} ${u('teach_own')}: ${(USER.groups || []).join(', ')}</p>
        <table><tr><th>${u('teach_student')}</th><th>${u('teach_status')}</th><th>${u('teach_choice')}</th><th>${u('teach_score')}</th></tr>
        ${demo.map(([n, s, ch, sc]) => `<tr><td>${n}</td><td><span class="chip ${st[s][1]}">${u(st[s][0])}</span></td><td>${ch === null ? '—' : ch === 'own' ? u('own') : 'ABC'[ch]}</td><td>${sc ?? '—'}</td></tr>`).join('')}</table>
        <button class="btn btn-l" style="margin-top:14px" id="tcsv">${ic('download')} ${u('export_csv')}</button></div>
    </div>`;
}

function pageAbout() {
  const accessIcons = ['monitor', 'qr', 'doc', 'cap', 'users'];
  return `<div class="about-cards">
      <div class="card pad"><h3>${ic('book')}${u('about_what')}</h3><p style="margin:0;color:var(--ink2)">${u('about_what_t')}</p></div>
      <div class="card pad"><h3>${ic('target')}${u('about_goal')}</h3><p style="margin:0;color:var(--ink2)">${u('about_goal_t')}</p></div>
      <div class="card pad"><h3>${ic('list')}${u('about_tasks')}</h3><ul class="ticks">${UI[LANG].tasks.map(x => `<li>${ic('check')}${x}</li>`).join('')}</ul></div>
    </div>
    <h2 class="sec-title">${u('access_title')}</h2>
    <div class="access">${UI[LANG].access.map((x, i) => `<div class="card"><div class="ai">${ic(accessIcons[i])}</div>${x}</div>`).join('')}</div>
    <div class="band">
      <div>${ic('award')}${LANG === 'kz' ? 'Amanzholov University түпнұсқа контенті' : 'Оригинальный контент Amanzholov University'}</div>
      <div>${ic('copy')}${LANG === 'kz' ? 'Жағдаяттық бейнематериалдарға авторлық құқықты тіркеу' : 'Регистрация авторских прав на ситуационные видеоматериалы'}</div>
      <div>${ic('users')}${LANG === 'kz' ? 'Студенттерге, оқытушыларға, тәлімгерлерге және серіктес ұйымдарға' : 'Для студентов, преподавателей, наставников и организаций-партнёров'}</div>
      <div>${ic('chart')}${LANG === 'kz' ? 'Педагогикалық білім сапасына үлес' : 'Вклад в качество педагогического образования'}</div>
    </div>`;
}

/* ---------- экспорт ---------- */
function downloadCSV(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- роутер ---------- */
function parse() {
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const [path, qs] = h.split('?');
  const parts = path.split('/');
  return { route: parts[0], a: parts[1], b: parts[2], q: new URLSearchParams(qs || '') };
}
function render() {
  const { route, a, b, q } = parse();
  document.documentElement.lang = LANG === 'kz' ? 'kk' : 'ru';
  document.title = `E-book · ${u('hero_title')}`;
  let page;
  const need = routeNeed(route, b);
  if (USER && route !== 'login' && !store.get('consent.' + USER.id, null)) { LOGIN.step = 'consent'; location.hash = '#/login'; return; }
  if (route === 'login' && USER && LOGIN.step !== 'consent') { location.hash = '#/' + ROLES[USER.role].home; return; }
  if (need && route !== 'case' && !USER) page = pageNeedLogin(location.hash);
  else if (need && route !== 'case' && !can(need)) page = pageDenied(need);
  else switch (route) {
    case 'login': page = pageLogin(); break;
    case 'editor': page = pageEditor(); break;
    case 'review': page = pageReview(); break;
    case 'admin': page = pageAdmin(); break;
    case 'catalog': page = pageCatalog(q); break;
    case 'case': page = pageCase(a, b || 'desc'); break;
    case 'ai': page = pageAI(a); break;
    case 'video': page = pageVideo(a); break;
    case 'materials': page = pageMaterials(); break;
    case 'profile': page = pageProfile(); break;
    case 'teacher': page = pageTeacher(); break;
    case 'about': page = pageAbout(); break;
    default: page = pageHome();
  }
  $('#app').innerHTML = header(route) + `<main><div class="wrap">${page}</div></main>
    <footer><div class="wrap">© 2026 ${u('uni')} · E-book «${u('hero_title')}» · ${u('proto')}</div></footer>` + tabbar(route);
  bind(route, a, b);
  bindAuth(route);
}

function bind(route, a) {
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { LANG = b.dataset.lang; store.set('lang', LANG); render(); });
  const hs = $('#hsearch'); if (hs) hs.onsubmit = e => { e.preventDefault(); location.hash = '#/catalog?q=' + encodeURIComponent(hs.q.value); };
  const cs = $('#csearch'); if (cs) cs.onsubmit = e => { e.preventDefault(); const p = parse().q; cs.q.value ? p.set('q', cs.q.value) : p.delete('q'); location.hash = '#/catalog?' + p; };
  const lv = $('#lvl'); if (lv) lv.onchange = () => { const p = parse().q; lv.value ? p.set('lvl', lv.value) : p.delete('lvl'); location.hash = '#/catalog?' + p; };

  if (route === 'case') {
    const id = a;
    const tb = $('.tabs'), on = $('.tabs a.on'); if (tb && on) tb.scrollLeft = on.offsetLeft - tb.clientWidth / 2 + on.clientWidth / 2;
    const hint = () => { const h = $('#savehint'); if (h) { h.textContent = '✓ ' + u('saved'); clearTimeout(h._t); h._t = setTimeout(() => h.textContent = '', 1500); } };
    document.querySelectorAll('[data-diag]').forEach(el => el.oninput = () => { const n = getNotes(id); n[el.dataset.diag] = el.value; uset('diag.' + id, n); hint(); });
    const rf = $('#refl'); if (rf) rf.oninput = () => { uset('refl.' + id, rf.value); hint(); };
    window._pick = window._pick || {}; window._pr = window._pr || {};
    document.querySelectorAll('[data-opt]').forEach(el => el.onclick = () => {
      const v = el.dataset.opt === 'own' ? 'own' : +el.dataset.opt;
      const d = getDecision(id); if (d) { d.choice = v; uset('dec.' + id, d); }
      window._pick[id] = v; keepScroll(render); if (v === 'own') $('#own')?.focus();
    });
    document.querySelectorAll('[data-pr]').forEach(el => el.onclick = () => {
      const d = getDecision(id); const arr = d ? d.pr : (window._pr[id] = window._pr[id] || []);
      const i = arr.indexOf(el.dataset.pr); i < 0 ? arr.push(el.dataset.pr) : arr.splice(i, 1);
      if (d) uset('dec.' + id, d); el.classList.toggle('on');
    });
    const sv = $('#savedec'); if (sv) sv.onclick = () => {
      const d = getDecision(id); const choice = d ? d.choice : window._pick[id];
      if (choice === undefined || choice === null) { toast(u('sol_title')); return; }
      uset('dec.' + id, { choice, own: $('#own').value, just: $('#just').value, pr: d ? d.pr : (window._pr[id] || []), at: new Date().toISOString() });
      toast(u('in_portfolio')); keepScroll(render);
    };
    const ul = $('#unlock'); if (ul) ul.onclick = () => { window._unlock = { ...(window._unlock || {}), [id]: true }; render(); };
    const bm = $('#bm'); if (bm) bm.onclick = () => toggleBm(id);
  }

  if (route === 'ai' && can('ai')) {
    const box = $('#msgs'); box.scrollTop = box.scrollHeight;
    $('#newchat').onclick = () => { chatInit(CHAT.caseId); render(); };
    box.onclick = e => {
      const p = e.target.closest('[data-pick]'); if (p) { location.hash = '#/ai/' + p.dataset.pick; return; }
      const g = e.target.closest('[data-go]'); if (g) { location.hash = g.dataset.go; return; }
      const r = e.target.closest('[data-report]'); if (r) {
        const m = CHAT.msgs[+r.dataset.report]; if (m.reported) return; m.reported = true; uset('chat', CHAT);
        const txt = (r.closest('.bubble')?.firstChild?.textContent || '').trim().slice(0, 140);
        const q = store.get('reports', []); q.unshift({ caseId: CHAT.caseId, who: pseudOf(USER.id), text: txt, at: new Date().toISOString() }); store.set('reports', q.slice(0, 30));
        audit('a_report', CHAT.caseId || ''); toast(u('ai_reported')); render(); }
    };
    $('#compose').onsubmit = e => {
      e.preventDefault(); const inp = $('#cinput'); const v = inp.value.trim(); if (!v) return;
      const replies = askTutor(v); uset('chat', CHAT); render();
      const b2 = $('#msgs'); b2.insertAdjacentHTML('beforeend', `<div class="msg" id="typing"><div class="bot">${ic('bot')}</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>`); b2.scrollTop = b2.scrollHeight;
      setTimeout(() => { CHAT.msgs.push(...replies); uset('chat', CHAT); render(); $('#cinput')?.focus(); }, 700);
    };
  }

  if (route === 'profile' && USER) $('#csv').onclick = () => audit('a_export', 'portfolio') || downloadCSV('portfolio.csv', [['case', 'title', 'choice', 'own', 'justification', 'principles', 'date'],
    ...portfolio().map(({ c, d }) => [c.id, t(c.title), d.choice === 'own' ? 'own' : 'ABC'[d.choice], d.own, d.just, (d.pr || []).map(p => t(PRINCIPLES.find(x => x.id === p))).join(', '), d.at])]);
  if (route === 'teacher' && can('teacher')) {
    $('#assign').onclick = () => { audit('a_assign', CASES.filter((x, i) => document.querySelectorAll('.checkrow input')[i]?.checked).map(x => x.id).join(', ')); toast(u('teach_done')); };
    $('#tcsv').onclick = () => audit('a_export', 'group-results') || downloadCSV('group-results-demo.csv', [['student', 'status', 'choice', 'score'], ['Студент 01', 'done', 'B', 92], ['Студент 02', 'done', 'A', 74], ['Студент 03', 'progress', '', ''], ['Студент 04', 'done', 'own', 88], ['Студент 05', 'none', '', '']]);
  }
}
function keepScroll(fn) { const y = scrollY; fn(); scrollTo(0, y); }

let LAST = '';
window.addEventListener('hashchange', () => { const { route, a } = parse(); const key = route + '/' + (a || ''); render(); if (key !== LAST) scrollTo(0, 0); LAST = key; });
LAST = parse().route + '/' + (parse().a || '');
render();

</script>
</body>
</html>
